name: Release

# A `v` tag makes a stable release named after it, such as `v1.1.0`. Once a day, `main` becomes a
# nightly pre-release when the app may have changed since the last one, and at once when run by
# hand. Every release holds one APK per CPU architecture and the `update.json` the app reads to
# update itself.
on:
  push:
    tags: ['v*']
  schedule:
    # Off the hour, when GitHub's scheduled runs are busiest.
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

# One release at a time, none cut short, and every one waiting kept in turn rather than replaced.
concurrency:
  group: release
  cancel-in-progress: false
  queue: max

env:
  GH_REPO: ${{ github.repository }}

jobs:
  plan:
    name: Name the release
    # Nightlies come from `main` only; a tag may be on any commit.
    if: github.ref_type == 'tag' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.plan.outputs.skip }}
      channel: ${{ steps.plan.outputs.channel }}
      tag: ${{ steps.plan.outputs.tag }}
      name: ${{ steps.plan.outputs.name }}
      code: ${{ steps.plan.outputs.code }}
      title: ${{ steps.plan.outputs.title }}
      since: ${{ steps.plan.outputs.since }}
    steps:
      - name: Name the release
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest_stable=$(gh release list --exclude-drafts --exclude-pre-releases --limit 1 \
            --json tagName --jq '.[0].tagName // ""')

          if [ "$GITHUB_REF_TYPE" = tag ]; then
            channel=stable
            tag=$GITHUB_REF_NAME
            name=${tag#v}
            title="Scale $name"
            since=$latest_stable
          else
            channel=nightly
            since=$(gh release list --exclude-drafts --limit 50 --json tagName,isPrerelease \
              --jq '[.[] | select(.isPrerelease)][0].tagName // ""')

            # A run by hand always releases; the daily one only when the app may have changed.
            if [ -n "$since" ] && [ "$GITHUB_EVENT_NAME" = schedule ]; then
              since_sha=$(gh api "repos/$GH_REPO/commits/$since" --jq .sha)

              if [ "$since_sha" = "$GITHUB_SHA" ]; then
                echo "Nothing has changed since $since."
                echo "skip=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi

              # Files that never reach the APK. Anything else, and any rename's old name, releases;
              # so does a comparison of 300 files, the most GitHub lists.
              compare=$(gh api "repos/$GH_REPO/compare/$since_sha...$GITHUB_SHA")
              app_changes=$(jq -r '.files[] | .filename, (.previous_filename // empty)' <<< "$compare" |
                grep -Ev '\.md$|^docs/|^LICENSE$|\.test\.ts$|/src/test/|^tools/|^\.github/workflows/ci\.yml$|^\.impeccable/' || true)

              if [ -z "$app_changes" ] && [ "$(jq '.files | length' <<< "$compare")" -lt 300 ]; then
                echo "Only documentation, tests and tooling have changed since $since."
                echo "skip=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi

            # The date, and this workflow's run number, which never repeats and finds the run.
            tag=nightly-$(date -u +%Y%m%d).$GITHUB_RUN_NUMBER

            # Named after the last stable release, or 0.0.1 before the first, and the commit built.
            base=${latest_stable#v}
            short=${GITHUB_SHA::7}
            name=${base:-0.0.1}-nightly.${tag#nightly-}+$short
            title="Nightly ${tag#nightly-} ($short)"
          fi

          # Minutes since 2026 began: every build, stable or nightly, installs over the ones before.
          code=$(( ($(date -u +%s) - $(date -u -d 2026-01-01 +%s)) / 60 ))

          {
            echo "skip=false"
            echo "channel=$channel"
            echo "tag=$tag"
            echo "name=$name"
            echo "code=$code"
            echo "title=$title"
            echo "since=$since"
          } >> "$GITHUB_OUTPUT"

  release:
    name: Build and publish
    needs: plan
    if: needs.plan.outputs.skip == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # Holds the upload key; only this job, for `main` and `v` tags, can read it.
    environment: release
    permissions:
      contents: write
    env:
      APP_VARIANT: production
      SCALE_VERSION_NAME: ${{ needs.plan.outputs.name }}
      SCALE_VERSION_CODE: ${{ needs.plan.outputs.code }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .node-version
          cache: true
          run-install: true

      - name: Format, lint, type-check and test
        run: |
          vp run check
          git diff --exit-code

      - name: Set up Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 17

      # The open-source cache; the default one comes under Gradle's own terms of use.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic

      - name: Generate the Android project
        run: vp run generate

      - name: Build the APKs
        env:
          SCALE_UPLOAD_KEYSTORE: ${{ secrets.SCALE_UPLOAD_KEYSTORE }}
          ORG_GRADLE_PROJECT_SCALE_UPLOAD_STORE_PASSWORD: ${{ secrets.SCALE_UPLOAD_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_SCALE_UPLOAD_KEY_ALIAS: ${{ secrets.SCALE_UPLOAD_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_SCALE_UPLOAD_KEY_PASSWORD: ${{ secrets.SCALE_UPLOAD_KEY_PASSWORD }}
        run: |
          for secret in SCALE_UPLOAD_KEYSTORE ORG_GRADLE_PROJECT_SCALE_UPLOAD_STORE_PASSWORD \
            ORG_GRADLE_PROJECT_SCALE_UPLOAD_KEY_ALIAS ORG_GRADLE_PROJECT_SCALE_UPLOAD_KEY_PASSWORD; do
            if [ -z "${!secret}" ]; then
              echo "::error::The release environment has no ${secret#ORG_GRADLE_PROJECT_} secret; see docs/releases.md."
              exit 1
            fi
          done

          keystore=$RUNNER_TEMP/upload.jks
          printf '%s' "$SCALE_UPLOAD_KEYSTORE" | base64 --decode > "$keystore"
          cd android
          ORG_GRADLE_PROJECT_SCALE_UPLOAD_STORE_FILE=$keystore ./gradlew assembleRelease

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ needs.plan.outputs.channel }}
          TAG: ${{ needs.plan.outputs.tag }}
          TITLE: ${{ needs.plan.outputs.title }}
          SINCE: ${{ needs.plan.outputs.since }}
        run: |
          out=$RUNNER_TEMP/release
          mkdir -p "$out"

          # Named without the version's `+commit`, which the release's title already shows.
          for apk in android/app/build/outputs/apk/release/app-*-release.apk; do
            abi=$(basename "$apk" -release.apk)
            cp "$apk" "$out/scale-${SCALE_VERSION_NAME%%+*}-${abi#app-}.apk"
          done

          printf '{"versionName":"%s","versionCode":%s,"channel":"%s"}\n' \
            "$SCALE_VERSION_NAME" "$SCALE_VERSION_CODE" "$CHANNEL" > "$out/update.json"

          flags=(--title "$TITLE" --generate-notes)
          [ -n "$SINCE" ] && flags+=(--notes-start-tag "$SINCE")

          if [ "$CHANNEL" = stable ]; then
            flags+=(--verify-tag --latest)
          else
            flags+=(--target "$GITHUB_SHA" --prerelease --latest=false)
          fi

          gh release create "$TAG" "$out"/* "${flags[@]}"

      - name: Keep the newest ten nightlies
        if: needs.plan.outputs.channel == 'nightly'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --exclude-drafts --limit 100 --json tagName,isPrerelease \
            --jq '.[] | select(.isPrerelease) | .tagName' |
            tail -n +11 |
            while read -r old; do
              gh release delete "$old" --yes --cleanup-tag
            done
